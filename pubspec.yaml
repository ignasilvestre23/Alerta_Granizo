name: AlertaGranizo
description: Alertas de granizo y tormentas en tiempo real (Argentina).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  http: ^1.2.1
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  flutter_local_notifications: ^17.2.2
  workmanager: ^0.9.0
  shared_preferences: ^2.2.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  image: ^4.2.0
  in_app_purchase: ^3.2.0
  google_mobile_ads: ^9.0.0
  home_widget: ^0.9.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0D294E"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 24
